# config/locations.yaml
#
# Daftar lokasi yang dipantau oleh pipeline DolanMalang.
# Koordinat berikut adalah perkiraan titik publik masing-masing tempat;
# silakan sesuaikan lat/lon jika kamu punya titik yang lebih presisi
# (mis. hasil pencocokan manual di Google Maps).
#
# elevation_m dipakai sebagai fitur statis pada tahap feature engineering
# (LK-05), bukan ditarik dari API — makanya disimpan di sini, bukan di
# data/raw/.

locations:
